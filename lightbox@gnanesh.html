<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery with Lightbox</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            text-align: center;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .gallery img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2 class="mt-3">Image Gallery</h2>
    <div class="gallery">
        <img src="https://wallpapercave.com/wp/wp4583894.jpg" class="gallery-item" alt="Image 1">
        <img src="https://w0.peakpx.com/wallpaper/35/177/HD-wallpaper-vijay-thalapathy-master-thalapathy-vijay.jpg" class="gallery-item" alt="Image 2">
        <img src="https://pbs.twimg.com/media/FyzXwOuX0AEM--Q.jpg" class="gallery-item" alt="Image 3">
        <img src="https://images.indianexpress.com/2022/10/Vijay-in-Varisu-Sri-Venkateswara-Pictures_Twitter.jpg" class="gallery-item" alt="Image 4">
        <img src="https://wallpapers.com/images/hd/vijay-new-film-2021-master-shot-pz1v516hz2utv96v.jpg" class="gallery-item" alt="Image 5">
    </div>
    
    <div class="lightbox" id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        $(document).ready(function() {
            $('.gallery-item').click(function() {
                let src = $(this).attr('src');
                $('#lightbox-img').attr('src', src);
                $('#lightbox').fadeIn();
            });
        });

        function closeLightbox() {
            $('#lightbox').fadeOut();
        }
    </script>
</body>
</html>
